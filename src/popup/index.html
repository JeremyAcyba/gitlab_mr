<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Gitlab enhancer settings</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main id="gitlab-mr">
			<p id="gitlab-mr__saved" class="gitlab-mr__saved" role="status" aria-live="polite"></p>

			<div class="gitlab-mr__field">
				<label for="gitlab-mr__track__mr">Merge request tracking</label>
				<select id="gitlab-mr__track__mr">
					<option value="">Track all merge requests</option>
					<option value="not_mine">Don't track merge requests opened by others</option>
					<option value="not_mine_participate">
						Don't track merge requests opened by others I didn't take part in
					</option>
				</select>
			</div>

			<fieldset class="gitlab-mr__field">
				<legend>Colors</legend>
				<div class="gitlab-mr__colors">
					<label for="gitlab-mr__color_action">Actions needed</label>
					<input type="color" id="gitlab-mr__color_action" />
					<label for="gitlab-mr__color_wait">Waiting</label>
					<input type="color" id="gitlab-mr__color_wait" />
					<label for="gitlab-mr__color_done">Done</label>
					<input type="color" id="gitlab-mr__color_done" />
				</div>
			</fieldset>
		</main>
		<script src="../shared/settings.js"></script>
		<script src="index.js"></script>
	</body>
</html>
